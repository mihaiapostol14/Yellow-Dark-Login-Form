<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yellow Dark Login Form</title>
  </head>
  <body>
    <div class="container">
      <h4 class="title">Login</h4>
      <form action="#" method="POST">
        <div class="input-box">
          <label for="username">Username</label>
          <input class="username" type="text" name="username" id="username" required />
        </div>

        <div class="input-box">
          <label for="password">Password</label>
          <i class="eye fa-solid fa-eye-slash"></i>
          <input class="password" type="password" name="password" id="password" required />
        </div>
        <div class="remember-me">
          <input class="checkbox-field" type="checkbox" name="remember" id="remeber" required />
          <label for="remeber">Remember me</label>
          <a href="#" class="forgot-password-link">forgot password?</a>
        </div>

        <p class="hint-text"></p>

        <div class="btn-box">
          <button class="btn" type="submit">Login</button>
        </div>

      </form>
      
        <div class="register-footer">
      <p>Don't have an account? <a href="#" class="register-link">Register</a></p>
    </div>


    </div>
  </body>
  <link rel="stylesheet" href="../css/style.css" />
  <script type="text/javascript" src="../js/script.js"></script>
  <script type="text/javascript" src="../js/LoginValidator.js"></script>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer" />
</html>
